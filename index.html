<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة باتول في البرمجة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1A2B4C; --teal:#00C4B3; --amber:#F4A622; --fog:#F0F4FB; --mid:#0D1526;
  --bg:var(--fog); --text:var(--navy); --card:#ffffff; --border:#dee6f4; --locked:#aab4c8;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:var(--mid); --text:#EAF0FB; --card:#152036; --border:#26314d; --locked:#4a5570; } }
:root[data-theme="dark"]{ --bg:var(--mid); --text:#EAF0FB; --card:#152036; --border:#26314d; --locked:#4a5570; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;overflow-x:hidden;}
.hero{text-align:center;padding:3.2rem 1.2rem 2rem;max-width:600px;margin:0 auto;}
.hero .eyebrow{color:var(--teal);font-weight:700;font-size:.95rem;}
.hero h1{font-size:2rem;margin:.4rem 0 .6rem;line-height:1.35;}
.hero p{color:var(--text);opacity:.78;font-size:1rem;line-height:1.7;margin:0;}
.hero .en{font-size:.82rem;opacity:.55;margin-top:.5rem;}
.path-wrap{position:relative;max-width:500px;margin:1rem auto 0;width:100%;aspect-ratio:400/2500;}
.path-wrap svg{position:absolute;inset:0;width:100%;height:100%;}
.path-line{fill:none;stroke:var(--teal);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 3.2s ease-out forwards .3s;}
@media (prefers-reduced-motion:reduce){.path-line{animation:none;stroke-dashoffset:0;}}
@keyframes draw{to{stroke-dashoffset:0;}}
.node{position:absolute;transform:translate(-50%,-50%);width:118px;text-align:center;
  opacity:0;transition:opacity .6s ease, transform .6s ease;cursor:pointer;}
.node.visible{opacity:1;}
.node .dot{width:56px;height:56px;border-radius:50%;background:var(--card);border:3px solid var(--teal);
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto .4rem;
  box-shadow:0 4px 14px rgba(0,0,0,.08);transition:transform .25s ease;position:relative;}
.node:hover .dot{transform:scale(1.08);}
.node .num{position:absolute;top:-6px;right:-6px;background:var(--amber);color:var(--navy);
  font-size:.68rem;font-weight:800;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.node .title{font-weight:700;font-size:.85rem;line-height:1.3;}
.node .en{font-size:.62rem;opacity:.6;font-weight:600;}
.node.locked .dot{border-color:var(--locked);border-style:dashed;opacity:.7;}
.node.locked .title,.node.locked .en{opacity:.55;}
.tooltip{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  font-size:.68rem;padding:.3rem .6rem;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.tooltip.show{opacity:1;}
.fade-end{position:absolute;left:0;right:0;bottom:0;height:220px;background:linear-gradient(to bottom, transparent, var(--bg));pointer-events:none;}

.sheet{position:fixed;inset:0;background:rgba(13,21,38,.5);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:10;}
.sheet.open{opacity:1;pointer-events:auto;}
.sheet-card{background:var(--card);width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:1.6rem 1.4rem calc(1.6rem + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .3s ease;max-height:75vh;overflow-y:auto;}
.sheet.open .sheet-card{transform:translateY(0);}
.sheet-card h2{margin:.2rem 0 .1rem;font-size:1.25rem;}
.sheet-card .en{color:var(--teal);font-weight:700;font-size:.8rem;}
.sheet-card p{line-height:1.75;font-size:.94rem;margin:.8rem 0;}
.milestone{background:rgba(244,166,34,.1);border-right:3px solid var(--amber);padding:.6rem .8rem;border-radius:0 8px 8px 0;font-size:.88rem;margin-top:.6rem;}
.close-btn{display:block;margin:1.1rem auto 0;background:var(--navy);color:#fff;border:none;padding:.6rem 1.4rem;
  border-radius:999px;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;}

.footer{text-align:center;padding:2rem 1.2rem 3rem;font-size:.8rem;opacity:.55;}
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">Batool's Coding Journey</div>
  <h1>خطوة بخطوة، رحلتك في عالم البرمجة بدأت</h1>
  <p>كل نقطة في الرحلة دي محطة هتتعلمي فيها حاجة جديدة، وهتبني بيها حاجة إنتِ اللي صممتيها.</p>
  <p class="en">Tap any stop on the path to see what it holds.</p>
</div>

<div class="path-wrap" id="pathWrap">
  <svg viewBox="0 0 400 2500" preserveAspectRatio="none">
    <path class="path-line" d="M100,150 C100,275 300,275 300,400 C300,525 100,525 100,650 C100,775 300,775 300,900 C300,1025 100,1025 100,1150 C100,1275 300,1275 300,1400 C300,1525 100,1525 100,1650 C100,1775 300,1775 300,1900 C300,2025 100,2025 100,2150 C100,2260 220,2260 220,2350"/>
  </svg>
  <div class="fade-end"></div>
</div>

<div class="footer">A learning journey built one step at a time — more of the path unlocks as we go.</div>

<div class="sheet" id="sheet">
  <div class="sheet-card">
    <div class="en" id="sheetEn"></div>
    <h2 id="sheetTitle"></h2>
    <p id="sheetDesc"></p>
    <div class="milestone" id="sheetMilestone"></div>
    <button class="close-btn" onclick="closeSheet()">تمام / Got it</button>
  </div>
</div>

<script>
const nodes = [
  {x:100,y:150,icon:'🧭',title:'التفكير كمبرمجة',en:'Thinking Like a Programmer',
   desc:'نبدأ برحلة بسيطة نتعلم فيها إزاي نفكر زي المبرمجة، ونربط اللي اتعلمتيه في سكراتش بعالم البرمجة الحقيقي.',
   milestone:'تقدري ترتّبي خطوات أي مهمة بترتيب واضح وصح.'},
  {x:300,y:400,icon:'🐍',title:'أساسيات بايثون',en:'Python Fundamentals',
   desc:'أول مرة تكتبي فيها كود حقيقي! هنتعلم المتغيرات والشروط والتكرار والدوال، ونبني مع بعض أول لعبة صغيرة.',
   milestone:'أول برنامج كامل بتكتبيه بنفسك من الألف للياء.'},
  {x:100,y:650,icon:'🧩',title:'البرمجة الكائنية',en:'Intro to OOP',
   desc:'هنتعرف إزاي نبني حاجات زي "شخصية" أو "حيوان أليف" جوه الكود، ونفكر في المشروع بطريقة أكتر تنظيمًا.',
   milestone:'مشروع بسيط ببني فيه Class خاص بيكي.'},
  {x:300,y:900,icon:'💾',title:'البيانات ومشاريع صغيرة',en:'Data & Mini Projects',
   desc:'هنتعلم نحفظ ونرجع للبيانات، ونبني برنامج بيفتكر حاجات زي قايمة مهام أو مذكرات شخصية.',
   milestone:'برنامج بيحتفظ بالبيانات حتى لو قفلتيه وفتحتيه تاني.'},
  {x:100,y:1150,icon:'🌐',title:'عالم الويب',en:'Web Sprint',
   desc:'استراحة ممتعة! هنتعلم HTML و CSS، ونبني صفحة ويب باسمك وبتصميمك إنتِ.',
   milestone:'صفحة ويب شخصية من تصميمك إنتِ.'},
  {x:300,y:1400,icon:'🏆',title:'المشروع الختامي',en:'Capstone Project',
   desc:'مشروعك الخاص، بفكرتك إنتِ، من التخطيط للتنفيذ للعرض النهائي قدام العيلة.',
   milestone:'مشروع كامل جاهز تعرضيه بفخر.'},
  {x:100,y:1650,icon:'🔒',title:'تطوير الويب المتقدم',en:'Advanced Web Dev',locked:true},
  {x:300,y:1900,icon:'🔒',title:'مشاريع حقيقية',en:'Real-World Projects',locked:true},
  {x:100,y:2150,icon:'✨',title:'…',en:'the path continues',locked:true},
];

const wrap = document.getElementById('pathWrap');
nodes.forEach((n,i)=>{
  const el = document.createElement('div');
  el.className = 'node' + (n.locked ? ' locked' : '');
  el.style.left = (n.x/400*100) + '%';
  el.style.top = (n.y/2500*100) + '%';
  el.innerHTML = `<div class="dot">${n.icon}${!n.locked ? `<span class="num">${i+1}</span>` : ''}</div>
    <div class="title">${n.title}</div><div class="en">${n.en}</div>
    ${n.locked ? '<div class="tooltip">قريبًا 🔒</div>' : ''}`;
  el.addEventListener('click', ()=> n.locked ? showTooltip(el) : openSheet(n));
  wrap.appendChild(el);
});

const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
},{threshold:.35});
document.querySelectorAll('.node').forEach(n=>io.observe(n));

function showTooltip(el){
  const tip = el.querySelector('.tooltip');
  tip.classList.add('show');
  setTimeout(()=>tip.classList.remove('show'),1400);
}
function openSheet(n){
  document.getElementById('sheetEn').textContent = n.en;
  document.getElementById('sheetTitle').textContent = n.title;
  document.getElementById('sheetDesc').textContent = n.desc;
  document.getElementById('sheetMilestone').textContent = n.milestone;
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); }
document.getElementById('sheet').addEventListener('click', e=>{ if(e.target.id==='sheet') closeSheet(); });
</script>
</body>
</html>
